services:
  db:
    image: postgres:16
    container_name: ipw-postgres
    environment:
      POSTGRES_DB: ipw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  db-test:
    image: postgres:16
    container_name: ipw-postgres-test
    environment:
      POSTGRES_DB: ipw_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipw-backend
    depends_on:
      - db
      - minio
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ipw
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ipw
      MINIO_SECRET_KEY: ipw-password
      MINIO_BUCKET: process-attachments

  frontend:
    build:
      context: ./js
      dockerfile: Dockerfile
    container_name: ipw-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./js:/app
      - /app/node_modules

  minio:
    image: minio/minio:latest
    container_name: ipw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ipw
      MINIO_ROOT_PASSWORD: ipw-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: ipw-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ipw ipw-password; do sleep 1; done;
      mc mb --ignore-existing local/process-attachments;
      mc anonymous set none local/process-attachments;
      "

volumes:
  postgres_data:
  minio_data:
